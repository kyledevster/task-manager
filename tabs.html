<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title class="title-elem">Document</title>
  <link rel="shortcut icon" href="assets/icons/favicon.svg" type="image/x-icon">
  <link rel="stylesheet" href="styles/shared.css">
  <link rel="stylesheet" href="styles/tabs.css">
</head>

<body>
  <header class="header">
    <a href="./index.html" tabindex="-1">
      <button class="home-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M3.53374 20.4932V13.6132C3.53374 12.84 2.90694 12.2132 2.13374 12.2132H0.901784C0.551562 12.2132 0.370443 11.795 0.610035 11.5395L10.5498 0.942241C11.0889 0.367501 11.9959 0.350704 12.5559 0.905092L23.287 11.5289C23.541 11.7803 23.3629 12.2132 23.0056 12.2132H21.8226C21.0494 12.2132 20.4226 12.84 20.4226 13.6132V20.4932C20.4226 21.2664 19.7958 21.8932 19.0226 21.8932H15.6004C14.8272 21.8932 14.2004 21.2664 14.2004 20.4932V17.1332C14.2004 16.36 13.5736 15.7332 12.8004 15.7332H11.156C10.3828 15.7332 9.75597 16.36 9.75597 17.1332V20.4932C9.75597 21.2664 9.12917 21.8932 8.35597 21.8932H4.93374C4.16054 21.8932 3.53374 21.2664 3.53374 20.4932Z" />
        </svg>
      </button>
    </a>
    <div class="tabs-container"></div>
    <button class="add-tab-btn add-btn">
      <span>+</span>
      <span>Add Tab</span>
    </button>
  </header>
  <main>
    <div class="popup-message hidden"></div>
    <h1 class="tab-title"></h1>
    <section class="tasks">
      <header>
        <h2 class="heading">Tasks</h2>
        <button class="add-task-btn add-btn">
          <span>+</span>
          <span>Add Task</span>
        </button>
      </header>
      <div class="tasks-content"></div>
    </section>
    <section class="events">
      <button class="hide-show-btn"></button>
      <div class="inner-events">
        <header>
          <h2 class="heading">Events</h2>
          <button class="add-event-btn add-btn">
            <span>+</span>
            <span>Add Event</span>
          </button>
        </header>
        <div class="events-content"></div>
      </div>
    </section>
    <section class="activity-calendar">
      <h2 class="heading"></h2>
      <div class="calendar-content"></div>
    </section>
    <button class="delete-tab-btn">Delete Tab</button>
  </main>
  <!-- ADD TAB POPUP -->
  <div class="add-tab-popup-cover display-none">
    <div class="add-tab-popup">
      <button class="close-popup-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-linecap="round"
          stroke-linejoin="round" id="X--Streamline-Tabler">
          <path d="M18 6 6 18" stroke-width="2"></path>
          <path d="m6 6 12 12" stroke-width="2"></path>
        </svg>
      </button>
      <h3 class="heading">New Tab</h3>
      <div class="input-fields-container">
        <label class="single-input">
          <div class="text">
            <span>Tab name</span><span class="char-count">0/20</span>
          </div>
          <input type="text" maxlength="20" name="Tab name" placeholder="eg. Tab 1, etc" class="tab-name-input required"
            autocomplete="off">
          <div class="error-text"></div>
        </label>
        <label>
          Select tab color
          <select name="tab color" class="color-select-container"></select>
          <div class="error-text"></div>
        </label>
      </div>
      <button class="create-tab-btn">Create</button>
    </div>
  </div>
  <!-- ADD TASK POPUP BOX -->
  <div class="add-task-popup-cover display-none">
    <div class="add-task-popup">
      <button class="close-popup-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-linecap="round"
          stroke-linejoin="round" id="X--Streamline-Tabler">
          <path d="M18 6 6 18" stroke-width="2"></path>
          <path d="m6 6 12 12" stroke-width="2"></path>
        </svg>
      </button>
      <h3 class="heading">New Task</h3>
      <div class="input-fields-container">
        <label class="single-input">
          <div class="text">
            <span>Task name</span><span class="char-count">0/40</span>
          </div>
          <input type="text" maxlength="40" name="Task name" placeholder="eg. Task 1, etc"
            class="task-name-input itim required" autocomplete="off">
          <div class="error-text"></div>
        </label>
        <label class="single-input">
          Task points
          <input type="number" min="1" max="3" name="Task points" placeholder="1-3" class="task-points-input required">
          <div class="error-text"></div>
        </label>
        <label class="single-input">
          Task URL(optional)
          <input type="url" name="Task url" placeholder="https://" class="task-url-input">
          <div class="error-text"></div>
        </label>
      </div>
      <button class="create-task-btn">Create</button>
    </div>
  </div>
  <!-- ADD EVENT POPUP BOX -->
  <div class="add-event-popup-cover display-none">
    <div class="add-event-popup">
      <button class="close-popup-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-linecap="round"
          stroke-linejoin="round" id="X--Streamline-Tabler">
          <path d="M18 6 6 18" stroke-width="2"></path>
          <path d="m6 6 12 12" stroke-width="2"></path>
        </svg>
      </button>
      <h3 class="heading">New Event</h3>
      <div class="input-fields-container">
        <label class="single-input">
          <div class="text">
            <span>Event name</span><span class="char-count">0/30</span>
          </div>
          <input type="text" maxlength="30" name="Event name" placeholder="eg. Event 1, etc."
            class="event-name-input itim required" autocomplete="off">
          <div class="error-text"></div>
        </label>
        <label class="single-input">
          Event date(optional)
          <input type="date" name="Event points" class="event-date-input">
          <div class="error-text"></div>
        </label>
      </div>
      <button class="create-event-btn">Create</button>
    </div>
  </div>
  <!-- DELETE CONFIRMATION BOX -->
  <div class="delete-confirm-popup-cover display-none">
    <div class="delete-confirm-popup">
      <div class="heading">Delete Task?</div>
      <div class="description"></div>
      <div class="btns">
        <div class="cancel-btn">Cancel</div>
        <div class="delete-btn">Delete</div>
      </div>
    </div>
  </div>

  <!-- DELETE TAB CONFIRMATION BOX -->
  <div class="delete-tab-confirm-popup-cover display-none">
    <div class="delete-tab-confirm-popup">
      <div class="heading">Delete Tab?</div>
      <div class="description">Type "Mathematics" to Delete the Tab.</div>
      <div class="input-fields-container">
        <label>
          <div class="text"></div>
          <input type="text" />
        </label>
      </div>
      <div class="btns">
        <div class="cancel-btn">Cancel</div>
        <div class="delete-btn">Delete</div>
      </div>
    </div>
  </div>

  <script src="scripts/tabs.js" type="module"></script>
</body>

</html>
